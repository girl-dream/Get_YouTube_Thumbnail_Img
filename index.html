<!DOCTYPE html>
<html lang="zh-CN">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="copyright" content="The Unlicense">
    <meta name="author" content="girl-dream">
    <title>提取Youtube视频封面</title>
    <link rel="shortcut icon" href="https://www.youtube.com/s/desktop/1dd30f43/img/favicon.ico" type="image/x-icon">
    <style>
        :root {
            --bg-color: #f9f9f9;
            --text-color: #333;
            --input-border: #ddd;
            --input-bg: #ffffff;
            --primary-color: #ff0000;
            --primary-hover: #cc0000;
            --tag-bg: #eee;
            --tag-text: #555;
            --secondary-btn-bg: #F6F7F8;
            --secondary-btn-hover: #E3E5E7;
            --img-placeholder: #ddd;
            --shadow: rgba(0, 0, 0, 0.1);
        }

        @media (prefers-color-scheme: dark) {
            :root {
                --bg-color: #121212;
                --text-color: #e0e0e0;
                --input-border: #333;
                --input-bg: #1e1e1e;
                --primary-color: #ff3333;
                --primary-hover: #ff5555;
                --tag-bg: #333;
                --tag-text: #bbb;
                --secondary-btn-bg: #555;
                --secondary-btn-hover: #777;
                --img-placeholder: #2a2a2a;
                --shadow: rgba(0, 0, 0, 0.5);
            }
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 40px 20px;
            margin: 0;
            transition: background-color 0.3s, color 0.3s;
        }

        /* 统一 Form 布局 */
        form {
            width: 100%;
            max-width: 630px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        #url-input {
            width: 100%;
            padding: 12px 15px;
            font-size: 16px;
            background-color: var(--input-bg);
            color: var(--text-color);
            border: 2px solid var(--input-border);
            border-radius: 8px;
            outline: none;
            transition: border-color 0.3s, background-color 0.3s;
            margin-bottom: 10px;
            box-sizing: border-box;
        }

        #url-input:focus {
            border-color: var(--primary-color);
        }

        .submit-btn {
            width: 100%;
            padding: 12px;
            background-color: var(--primary-color);
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            transition: background 0.3s;
            margin-bottom: 30px;
        }

        .submit-btn:hover {
            background-color: var(--primary-hover);
        }

        .results-container {
            width: 100%;
            max-width: 900px;
            display: flex;
            flex-direction: column;
        }

        .result-item {
            margin-bottom: 20px;
        }

        img:not([src]) {
            display: none;
        }

        .tag {
            font-weight: bold;
            margin-bottom: 8px;
            color: var(--tag-text);
            display: inline-block;
            background: var(--tag-bg);
            padding: 2px 8px;
            border-radius: 4px;
        }

        img {
            background-color: var(--img-placeholder);
            border-radius: 8px;
            object-fit: cover;
            box-shadow: 0 4px 12px var(--shadow);
        }

        #maxresdefault {
            width: 100%;
        }

        #hqdefault {
            display: block;
            margin: 0 auto;
        }

        .copy-row {
            display: flex;
            gap: 8px;
            margin-bottom: 20px;
        }

        .copy-row input {
            flex: 1;
            padding: 8px;
            border: 1px solid var(--input-border);
            border-radius: 4px;
            background: var(--input-bg);
            color: var(--text-color);
            font-size: 13px;
        }

        .copy-row button {
            transition: background-color .3s, color .3s;
            background-color: var(--secondary-btn-bg);
            color: var(--tag-text);
            border: none;
            padding: 0 15px;
            border-radius: 4px;
            cursor: pointer;
            font-size: 13px;
            white-space: nowrap;
            transition: background 0.3s;
        }

        .copy-row button:hover {
            background-color: var(--secondary-btn-hover);
        }
    </style>
</head>

<body>
    <form>
        <input type="url" id="url-input" placeholder="在此处填写YouTube链接 (例如: https://www.youtube.com/watch?v=dQw4w9WgXcQ)"
            required>
        <input type="submit" class="submit-btn" value="提取图片">
        <div class="results-container">
            <!-- 720p 组 -->
            <div class="result-item">
                <div class="tag">720p</div>
                <img id="maxresdefault">
            </div>
            <div class="copy-row">
                <input type="url" id="maxresdefaultUrl" readonly>
                <button type="button" id="maxresdefaultBtn">复制链接</button>
            </div>

            <!-- 360p 组 -->
            <div class="result-item">
                <div class="tag">360p</div>
                <img id="hqdefault">
            </div>
            <div class="copy-row">
                <input type="url" id="hqdefaultUrl" readonly>
                <button type="button" id="hqdefaultBtn">复制链接</button>
            </div>
        </div>
    </form>
    <script>
        const url_input = document.getElementById('url-input')

        document.querySelector('form').onsubmit = (e) => {
            e.preventDefault()
            const url = new URL(url_input.value)
            if (!url.host.includes('youtube')) {
                alert('非Youtube链接')
                return
            }
            const params = new URLSearchParams(url.search)
            const maxresUrl = `https://i.ytimg.com/vi/${params.get('v')}/maxresdefault.jpg`
            maxresdefault.src = maxresUrl
            maxresdefaultUrl.value = maxresUrl
            maxresdefaultBtn.onclick = function () {
                debounce(copy(this, hqdeUrl), 3000)
            }
            const hqdeUrl = `https://i.ytimg.com/vi/${params.get('v')}/hqdefault.jpg`
            hqdefault.src = hqdeUrl
            hqdefaultUrl.value = hqdeUrl
            hqdefaultBtn.onclick = function () {
                debounce(copy(this, hqdeUrl), 3000)
            }
        }

        function copy(dom, text) {
            try {
                navigator.clipboard.writeText(text)
                dom.textContent = '复制成功'
                dom.style.color = '#28a745'
            } catch (error) {
                dom.textContent = '复制失败'
                dom.style.color = '#dc3545'
                console.error(error)
            } finally {
                setTimeout(() => {
                    dom.textContent = '复制链接'
                    dom.style.color = 'var(--tag-text)'
                }, 1000)
            }
        }

        function debounce(func, delay) {
            let timer
            return function () {
                clearTimeout(timer)
                timer = setTimeout(() => {
                    func.apply(this, arguments)
                }, delay)
            }
        }
    </script>
</body>

</html>
